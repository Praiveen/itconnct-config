server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/itconnect_workspace
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service-backend:8081/oauth2/jwks

  rabbitmq:
    # если RabbitMQ разворачиваешь в k8s через helm bitnami/rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  cloud:
    compatibility-verifier:
      enabled: false

supabase:
  s3:
    endpoint: http://localhost:9000/storage/v1/s3
    region: eu-central-1
    access-key: dummy-access-key
    secret-key: dummy-secret-key
    bucket: dummy-bucket

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server-backend:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}